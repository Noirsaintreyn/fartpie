services:
  - type: web
    name: fartpie
    runtime: python
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENV
        value: production

  # ONE worker: vector screener + Discord bot together (same disk, so /check and /history work).
  # First boot pulls ~14 months of 15m bars from LSE by itself. The options ratio comes from git (live_data/), refreshed weekly by tools/weekly_ratio.sh on the Mac.
  # Secrets to set once in the Render dashboard: DISCORD_TOKEN, DISCORD_GUILD_ID, VECTOR_CHANNEL_ID, LSE_API_KEY, BACKEND_USER, BACKEND_PASSWORD.
  - type: worker
    name: fartpie-live
    runtime: python
    branch: main
    autoDeploy: true
    plan: standard           # 2 GB: one scan peaks ~420 MB + bot + charts
    buildCommand: pip install -r requirements.txt -r discord_bot/requirements.txt
    startCommand: python -u screener_service.py
    disk:
      name: live-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - {key: PYTHON_VERSION, value: "3.12"}
      - {key: PYTHONUNBUFFERED, value: "1"}
      - {key: DATA_DIR, value: /data}
      - {key: RUN_BOT, value: "1"}
      - {key: SCREENER_PY, value: python}
      - {key: MID_BOOK, value: "0"}
      - {key: OPTVOL_FILE, value: live_data/optvol_ratio_live.csv}
      - {key: OPT_STALE_DAYS, value: "45"}
      - {key: BACKEND_URL, value: https://fartpie.onrender.com}
      - {key: DISCORD_TOKEN, sync: false}
      - {key: DISCORD_GUILD_ID, sync: false}
      - {key: VECTOR_CHANNEL_ID, sync: false}
      - {key: LSE_API_KEY, sync: false}
      - {key: BACKEND_USER, sync: false}
      - {key: BACKEND_PASSWORD, sync: false}
